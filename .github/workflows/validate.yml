name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    name: Module consistency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite of every module that has one
        run: |
          status=0
          for tests in */tests; do
            module="${tests%/tests}"
            echo "::group::$module"
            (cd "$module" && pytest -q) || status=1
            echo "::endgroup::"
          done
          exit $status

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            */README.md
            */docs/**/*.md

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "README.md" "*/README.md" "*/docs/**/*.md"
          fail: true

  diagrams:
    name: Mermaid syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render every Mermaid block (fails on syntax errors)
        run: |
          npm install --no-save @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/mermaid
          for f in $(git ls-files '*.md'); do
            if grep -q '```mermaid' "$f"; then
              out="/tmp/mermaid/$(echo "$f" | tr '/' '_')"
              npx mmdc -p /tmp/puppeteer.json -i "$f" -o "$out"
            fi
          done
