name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    name: Module consistency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the test suite of every module that has one
        run: |
          status=0
          for tests in */tests; do
            module="${tests%/tests}"
            echo "::group::$module"
            (cd "$module" && pytest -q) || status=1
            echo "::endgroup::"
          done
          exit $status

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            */README.md
            */docs/**/*.md

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "README.md" "*/README.md" "*/docs/**/*.md"
          fail: true

  diagrams:
    name: Mermaid syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract each Mermaid block into its own .mmd file
        run: python3 scripts/extract_mermaid.py /tmp/mmd
      - name: Render every block (fails on the first syntax error, naming the file and line)
        run: |
          npm install --no-save @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          status=0
          for f in /tmp/mmd/*.mmd; do
            if ! npx mmdc -p /tmp/puppeteer.json -i "$f" -o "${f%.mmd}.svg"; then
              echo "::error::Mermaid syntax error in $(basename "$f")"
              status=1
            fi
          done
          exit $status
